<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Harmonia">
<meta name="description" content="A relaxation instrument: never-ending chord progressions walked around Coltrane’s circle of fifths, binaural beats, guided breath and colors that move in harmony with the music.">
<title>Harmonia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23e2ab95' stroke-width='2'/%3E%3Cpath d='M32 10 51 43 13 43Z' fill='none' stroke='%23ffa066' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&display=swap">
<style>
:root {
  --ink: #f4e9df;
  --ash: rgba(244, 233, 223, 0.58);
  --faint: rgba(244, 233, 223, 0.16);
  --sheet: rgba(8, 5, 6, 0.46);
  --accent: #ffb48a;
  --serif: 'Spectral', 'Iowan Old Style', Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --gutter: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  background: #000;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

#field {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  z-index: 0;
  display: block;
}

.app {
  position: relative; z-index: 1;
  max-width: 560px;
  margin: 0 auto;
  padding: env(safe-area-inset-top) var(--gutter) calc(84px + env(safe-area-inset-bottom));
  min-height: 100vh;
}

/* header */
.top { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 0 0; }
.name { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 28px; margin: 0; letter-spacing: .01em; }
.text-btn { color: var(--ash); padding: 10px 2px; min-height: 44px; }
.text-btn:hover, .text-btn:active { color: var(--ink); }

/* stage */
.stage { position: relative; width: min(100%, 44vh, 440px); aspect-ratio: 1; margin: 0 auto; }
.stage canvas { width: 100%; height: 100%; display: block; }
.stage-play {
  position: absolute; inset: 36%;
  border-radius: 50%;
  display: grid; place-items: center;
}
.stage-play svg { width: 40%; height: 40%; fill: var(--ink); filter: drop-shadow(0 0 14px rgba(255, 200, 160, .55)); transition: opacity .6s; }
.stage-play.on svg { opacity: 0; }

/* now playing */
.now { text-align: center; min-height: 86px; margin-top: 2px; }
.now-key { font-family: var(--serif); font-size: 21px; font-weight: 300; }
.now-key i { color: var(--ash); }
.now-roman { margin-top: 4px; font-size: 14px; color: var(--ash); letter-spacing: .02em; }
.now-roman span { transition: color 1.2s, text-shadow 1.2s; padding: 0 1px; }
.now-roman span.cur { color: var(--ink); text-shadow: 0 0 12px rgba(255, 220, 190, .8); }
.now-song { margin-top: 2px; font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ash); }

/* chips */
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.chip {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 2px; border-radius: 12px;
  background: var(--sheet);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  min-height: 56px;
}
.chip-v { font-family: var(--serif); font-size: 17px; line-height: 1.2; }
.chip-l { font-size: 12px; color: var(--ash); }

/* transport */
.transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 14px 0 8px; }
.play {
  justify-self: start;
  min-width: 112px; min-height: 48px; padding: 0 22px;
  border-radius: 999px;
  background: rgba(255, 240, 228, .9); color: #1a0e0a;
  font-weight: 500;
  box-shadow: 0 0 28px rgba(255, 190, 150, .25);
}
.play[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: inset 0 0 0 1px var(--faint); }
.clock { font-variant-numeric: tabular-nums; color: var(--ash); font-size: 14px; text-align: center; }
#immerseBtn { justify-self: end; }

/* panel */
.panel {
  background: var(--sheet);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-radius: 18px;
  padding: 6px 16px 14px;
}
.panel h2 { font-family: var(--serif); font-weight: 300; font-size: 21px; margin: 10px 0 2px; }
.note { font-size: 13px; color: var(--ash); margin: 6px 0 4px; }
.row { display: grid; grid-template-columns: 112px 1fr 52px; align-items: center; gap: 10px; min-height: 46px; }
.row.wide { grid-template-columns: 112px 1fr; }
.row-l { font-size: 14px; color: var(--ash); }
.row-v { font-size: 13px; color: var(--ash); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; margin: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  padding: 6px 10px; min-height: 34px; border-radius: 999px;
  font-size: 13px; color: var(--ash);
  box-shadow: inset 0 0 0 1px var(--faint);
}
.seg button[aria-pressed="true"] { color: #1a0e0a; background: rgba(255, 240, 228, .88); box-shadow: none; }
.pool { list-style: none; margin: 6px 0 0; padding: 0; }
.pool label { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding: 7px 0; border-top: 1px solid var(--faint); cursor: pointer; }
.pool input { margin: 3px 0 0; accent-color: var(--accent); width: 16px; height: 16px; }
.pool b { font-weight: 400; font-size: 14px; }
.pool small { display: block; color: var(--ash); font-size: 12px; }
.swatches { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
.sw { flex: 1 1 60px; border-radius: 12px; height: 54px; position: relative; transition: background 1.5s; }
.sw span { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: rgba(0, 0, 0, .7); font-weight: 500; }
.share { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--ash); }
.share button { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; padding: 8px 0; }

/* tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  display: grid; grid-template-columns: repeat(6, 1fr);
  max-width: 560px; margin: 0 auto;
  padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(0, 0, 0, .78), rgba(0, 0, 0, .5));
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.tab { min-height: 48px; font-size: 13px; color: var(--ash); border-radius: 10px; }
.tab[aria-selected="true"] { color: var(--ink); background: rgba(255, 255, 255, .07); }

/* immersive mode */
.immerse { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; cursor: none; }
.immerse canvas { width: min(92vw, 92vh); height: min(92vw, 92vh); display: block; }
.imm-hint { position: absolute; top: calc(18px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 13px; color: var(--ash); transition: opacity 1s; }
body.immersed .app, body.immersed .tabs { visibility: hidden; }

.overlay { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(0, 0, 0, .7); text-align: center; padding: 24px; }
.overlay button { padding: 14px 26px; border-radius: 999px; background: rgba(255, 240, 228, .92); color: #1a0e0a; font-weight: 500; }
.overlay p { color: var(--ash); font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  .now-roman span, .sw { transition: none; }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<div class="app" id="app">
  <header class="top">
    <h1 class="name">Harmonia</h1>
    <button class="text-btn" id="newBtn">New journey</button>
  </header>

  <section class="stage" aria-label="Circle view">
    <canvas id="wheel" role="img" aria-label="The current chord progression drawn as a figure on the circle of fifths"></canvas>
    <button id="stagePlay" class="stage-play" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>
    </button>
  </section>

  <section class="now" aria-live="polite">
    <div class="now-key" id="nowKey"></div>
    <div class="now-roman" id="nowRoman"></div>
    <div class="now-song" id="nowSong"></div>
  </section>

  <div class="chips" id="chips">
    <button class="chip" data-chip="cycle"><span class="chip-v" id="c-cycle"></span><span class="chip-l">per chord</span></button>
    <button class="chip" data-chip="beats"><span class="chip-v" id="c-beats"></span><span class="chip-l">beats</span></button>
    <button class="chip" data-chip="breath"><span class="chip-v" id="c-breath"></span><span class="chip-l">breath</span></button>
    <button class="chip" data-chip="colors"><span class="chip-v" id="c-colors"></span><span class="chip-l">colors</span></button>
  </div>

  <section class="transport">
    <button id="playBtn" class="play" aria-pressed="false">Play</button>
    <div class="clock" id="clock"></div>
    <button id="immerseBtn" class="text-btn">Immerse</button>
  </section>

  <main class="panel" id="panel"></main>
</div>

<nav class="tabs" role="tablist" id="tabs">
  <button class="tab" role="tab" data-tab="journey">Journey</button>
  <button class="tab" role="tab" data-tab="sound">Sound</button>
  <button class="tab" role="tab" data-tab="beats">Beats</button>
  <button class="tab" role="tab" data-tab="noise">Noise</button>
  <button class="tab" role="tab" data-tab="color">Color</button>
  <button class="tab" role="tab" data-tab="sleep">Sleep</button>
</nav>

<div class="immerse" id="immerse" hidden>
  <canvas id="immWheel" aria-hidden="true"></canvas>
  <div class="imm-hint" id="immHint">Double-tap or press Esc to return</div>
</div>

<div class="overlay" id="resume" hidden>
  <div>
    <button id="resumeBtn">Tap to resume</button>
    <p>The browser paused the sound when the page left the screen.</p>
  </div>
</div>

<script>
'use strict';

/* =========================================================
   Helpers
   ========================================================= */
const TAU = Math.PI * 2;
const mod = (n, m = 12) => ((n % m) + m) % m;
const norm = a => ((a % 360) + 360) % 360;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const $ = id => document.getElementById(id);
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x, 0, 1));

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function weighted(rng, items, w) {
  const total = items.reduce((s, x) => s + w(x), 0);
  let r = rng() * total;
  for (const x of items) { r -= w(x); if (r <= 0) return x; }
  return items[items.length - 1];
}

/* =========================================================
   Music data
   Progressions come from The Coltrane Circle (../circle_progression).
   pat = degree:family relative to the tonic (M major, m minor, 7 dominant, d diminished)
   w   = how often the journey picks it (calmer patterns weigh more)
   ========================================================= */
const NOTE = ['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const fIdx = pc => mod(pc * 7);   // pitch class -> position on the circle of fifths

const QUAL = {
  M:    { sym: '',     iv: [0, 4, 7] },
  maj7: { sym: 'maj7', iv: [0, 4, 7, 11] },
  add9: { sym: 'add9', iv: [0, 4, 7, 14] },
  m:    { sym: 'm',    iv: [0, 3, 7] },
  m7:   { sym: 'm7',   iv: [0, 3, 7, 10] },
  '7':  { sym: '7',    iv: [0, 4, 7, 10] },
  dim:  { sym: '°',    iv: [0, 3, 6] },
  m7b5: { sym: 'ø7',   iv: [0, 3, 6, 10] },
};

const PROGRESSIONS = [
  { id:'axis',       name:'The “Axis” progression',      roman:'I – V – vi – IV',            pat:'0:M 7:M 9:m 5:M',                 w:1,   on:true,  song:'“Let It Be” — The Beatles' },
  { id:'axis-min',   name:'Axis, minor-first',           roman:'vi – IV – I – V',            pat:'9:m 5:M 0:M 7:M',                 w:1,   on:true,  song:'“Zombie” — The Cranberries' },
  { id:'doowop',     name:'’50s doo-wop',                roman:'I – vi – IV – V',            pat:'0:M 9:m 5:M 7:M',                 w:0.8, on:true,  song:'“Stand By Me” — Ben E. King' },
  { id:'turnaround', name:'Turnaround',                  roman:'I – vi – ii – V',            pat:'0:M 9:m 2:m 7:M',                 w:1,   on:true,  song:'“Blue Moon” — Rodgers & Hart' },
  { id:'251',        name:'ii – V – I',                  roman:'ii – V – I',                 pat:'2:m 7:M 0:M',                     w:1.2, on:true,  song:'“Autumn Leaves” — Kosma / Mercer' },
  { id:'rock',       name:'Three-chord rock',            roman:'I – IV – V',                 pat:'0:M 5:M 7:M',                     w:0.4, on:false, song:'“La Bamba” — Ritchie Valens' },
  { id:'mixo',       name:'Mixolydian ♭VII',             roman:'I – ♭VII – IV',              pat:'0:M 10:M 5:M',                    w:0.6, on:true,  song:'“Hey Jude” (coda) — The Beatles' },
  { id:'andalusian', name:'Andalusian cadence',          roman:'i – ♭VII – ♭VI – V',         pat:'0:m 10:M 8:M 7:M',                w:0.7, on:true,  song:'“Walk, Don’t Run” — The Ventures' },
  { id:'aeolian',    name:'Aeolian descent',             roman:'i – ♭VII – ♭VI',             pat:'0:m 10:M 8:M',                    w:1,   on:true,  song:'“Stairway to Heaven” (finale) — Led Zeppelin' },
  { id:'creep',      name:'Major III & borrowed iv',     roman:'I – III – IV – iv',          pat:'0:M 4:M 5:M 5:m',                 w:0.6, on:true,  song:'“Creep” — Radiohead' },
  { id:'pachelbel',  name:'Pachelbel’s Canon',           roman:'I – V – vi – iii – IV – I – IV – V', pat:'0:M 7:M 9:m 4:m 5:M 0:M 5:M 7:M', w:1.3, on:true, song:'Canon in D — Johann Pachelbel' },
  { id:'twoofus',    name:'“Just the Two of Us” changes',roman:'IVmaj7 – III7 – vi7 – v7 – I7', pat:'5:M 4:7 9:m 7:m 0:7',          w:1,   on:true,  song:'Grover Washington Jr. & Bill Withers' },
  { id:'royal',      name:'Royal Road',                  roman:'IV – V – iii – vi',          pat:'5:M 7:M 4:m 9:m',                 w:1.2, on:true,  song:'A staple of J-pop and anime themes' },
  { id:'coltrane',   name:'Coltrane changes',            roman:'I – ♭III7 – ♭VI – VII7 – III', pat:'0:M 3:7 8:M 11:7 4:M',          w:0.7, on:true,  song:'“Giant Steps” — John Coltrane' },
  { id:'chain',      name:'Circle-of-fifths chain',      roman:'vi – ii – V – I – IV – viiø – III – vi', pat:'9:m 2:m 7:7 0:M 5:M 11:d 4:7 9:m', w:1.2, on:true, song:'“Fly Me to the Moon” — Bart Howard' },
  { id:'blues',      name:'12-bar blues (condensed)',    roman:'I7 – IV7 – I7 – V7 – IV7 – I7', pat:'0:7 5:7 0:7 7:7 5:7 0:7',      w:0.3, on:false, song:'“Sweet Home Chicago” — Robert Johnson' },
  { id:'tritone',    name:'Tritone-sub turnaround',      roman:'Imaj7 – II7 – ii7 – ♭II7 – Imaj7', pat:'0:M 2:7 2:m 1:7 0:M',       w:0.8, on:true,  song:'“The Girl from Ipanema” — A. C. Jobim' },
  { id:'mario',      name:'Mario cadence',               roman:'♭VI – ♭VII – I',             pat:'8:M 10:M 0:M',                    w:0.8, on:true,  song:'Many film-score climaxes' },
].map(p => {
  const q = p.pat.split(' ').map(t => { const [d, f] = t.split(':'); return { d: +d, f }; });
  return { ...p, q, minor: q[0].d === 0 && q[0].f === 'm', romans: p.roman.split(' – ') };
});

/* Color harmonies from Color Wheel Studio (../color-wheel). Offsets in degrees from the chord root's hue.
   "Chord tones" maps every note of the chord onto the wheel, so a major chord becomes the
   wheel's own "Major Chord" harmony. */
const HARMONIES = {
  chord:     { name: 'Chord tones',         short: 'Chord',    offsets: null },
  narrow:    { name: 'Narrow Analogous',    short: 'Narrow',   offsets: [-15, 0, 15] },
  analogous: { name: 'Analogous',           short: 'Analog',   offsets: [-30, 0, 30] },
  split:     { name: 'Split Complementary', short: 'Split',    offsets: [0, 150, 210] },
  triadic:   { name: 'Triadic',             short: 'Triad',    offsets: [0, 120, 240] },
  golden:    { name: 'Golden Angle',        short: 'Golden',   offsets: [0, 137.508, 275.016] },
  fifth:     { name: 'Perfect Fifth',       short: 'Fifth',    offsets: [0, 210] },
  whole:     { name: 'Whole-Tone',          short: 'Whole',    offsets: [0, 60, 120, 180, 240, 300] },
};
const COLOR_NAMES = ['Red','Vermilion','Orange','Amber','Gold','Yellow','Chartreuse','Lime','Green','Emerald','Jade','Teal',
  'Aqua','Cyan','Azure','Cerulean','Blue','Indigo','Violet','Purple','Magenta','Fuchsia','Rose','Crimson'];
const colorName = h => COLOR_NAMES[Math.floor(norm(h) / 15) % 24];

/* Breath patterns: [in, hold, out, rest] seconds. */
const BREATH = {
  off:      { name: 'Off',       p: [5, 1, 7, 2] },   // still drives a soft visual tide, but no guide or swell
  coherent: { name: 'Coherent',  p: [5.5, 0, 5.5, 0] },
  box:      { name: 'Box',       p: [4, 4, 4, 4] },
  '478':    { name: '4 · 7 · 8', p: [4, 7, 8, 0] },
};
const BREATH_WORDS = ['breathe in', 'hold', 'breathe out', 'rest'];

const BEAT_STATES = {
  delta:    { name: 'Delta',    sym: 'δ', hz: 2.5,  tip: 'deep, dreamless sleep' },
  theta:    { name: 'Theta',    sym: 'θ', hz: 5.5,  tip: 'drowsy, meditative, dreamlike' },
  schumann: { name: 'Schumann', sym: '◎', hz: 7.83, tip: 'the Earth’s resonance' },
  alpha:    { name: 'Alpha',    sym: 'α', hz: 10,   tip: 'calm and awake' },
};

/* =========================================================
   Settings
   ========================================================= */
const DEFAULTS = {
  tab: 'journey',
  cycle: 10, rich: true, wander: 'coltrane', tuning: 432,
  pool: Object.fromEntries(PROGRESSIONS.map(p => [p.id, p.on])),
  drone: { vol: 0.7, bass: 0.45, bright: 0.45 },
  pulse: { vol: 0.35, density: 0.35 },
  space: 0.55,
  beats: { vol: 0.5, state: 'theta', hz: 5.5, descend: false, carrier: 'chord' },
  noise: { vol: 0.25, type: 'ocean' },
  color: { harmony: 'chord', map: 'fifths', shift: 0, sat: 55, glow: 0.6 },
  breath: { pattern: 'coherent', depth: 0.5 },
  sleep: { timer: 0, warmth: 0.45 },
};
const STORE_KEY = 'harmonia.v1';
function deepMerge(base, over) {
  const out = Array.isArray(base) ? base.slice() : { ...base };
  if (!over || typeof over !== 'object') return out;
  for (const k of Object.keys(base)) {
    if (!(k in over)) continue;
    out[k] = base[k] && typeof base[k] === 'object' ? deepMerge(base[k], over[k]) : over[k];
  }
  return out;
}
let S = DEFAULTS;
try { S = deepMerge(DEFAULTS, JSON.parse(localStorage.getItem(STORE_KEY) || 'null')); } catch (e) { S = deepMerge(DEFAULTS, null); }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* private mode */ } }
const getPath = p => p.split('.').reduce((o, k) => o[k], S);
function setPath(p, v) { const ks = p.split('.'); const last = ks.pop(); ks.reduce((o, k) => o[k], S)[last] = v; }

/* =========================================================
   Journey: a seeded, never-ending walk through the progressions.
   Each progression repeats 2–3 times, then the key steps around the circle
   (a fifth, or a Coltrane major third) and a new progression begins.
   ========================================================= */
class Journey {
  constructor(seed) {
    this.seed = seed;
    this.rng = mulberry32(seed);
    this.home = Math.floor(this.rng() * 12);   // major key signature the journey is in
    this.prog = null; this.idx = 0; this.pass = 0; this.passes = 2;
  }
  pool() {
    const p = PROGRESSIONS.filter(x => S.pool[x.id]);
    return p.length ? p : PROGRESSIONS.filter(x => x.id === 'pachelbel');
  }
  pick() {
    let pool = this.pool();
    if (pool.length > 1 && this.prog) pool = pool.filter(x => x !== this.prog);
    return weighted(this.rng, pool, x => x.w);
  }
  modulate() {
    if (S.wander === 'stay') return;
    const c = S.wander === 'coltrane' ? 1 : 0;
    const steps = [[0, 3], [7, 1.6], [5, 1.6], [4, 1.1 * c], [8, 1.1 * c], [3, 0.25], [9, 0.25]];
    this.home = mod(this.home + weighted(this.rng, steps, s => s[1])[0]);
  }
  ensure() {
    if (this.prog) return;

  const k = 1 - Math.exp(-dt / tau);
  for (let i = 0; i < BLOBS; i++) {
    const target = vs.palette[i % vs.palette.length];
    blobHue[i] = blobHue[i] == null ? target : hueLerp(blobHue[i], target, k);
  }
  const guided = vs.breath.key !== 'off';
  const env = guided ? vs.breath.env : 0.4 * vs.breath.env + 0.3;
  const minor = /^m/.test(vs.ev.q) ? 0.88 : 1;
  const glow = S.color.glow * minor * (0.72 + 0.28 * env);
  const sat = S.color.sat;
  fctx.globalCompositeOperation = 'source-over';
  fctx.fillStyle = `hsl(${blobHue[0]}, ${sat * 0.5}%, ${3 + 4 * glow}%)`;
  fctx.fillRect(0, 0, w, h);
  fctx.globalCompositeOperation = 'lighter';
  const M = Math.max(w, h);
  for (let i = 0; i < BLOBS; i++) {
    const f1 = 0.011 * Math.pow(PHI, i * 0.5), f2 = 0.013 * Math.pow(PHI, i * 0.37);
    const x = w * (0.5 + 0.34 * Math.sin(t * f1 + i * 2.39996));
    const y = h * (0.5 + 0.34 * Math.cos(t * f2 + i * 1.7));
    const r = M * (0.5 + 0.12 * Math.sin(t * 0.017 + i)) * (0.9 + 0.12 * env);
    const L = (i === 0 ? 34 : 28) * glow;
    const g = fctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `hsla(${blobHue[i]}, ${sat}%, ${L}%, 0.55)`);
    g.addColorStop(0.5, `hsla(${blobHue[i]}, ${sat}%, ${L * 0.7}%, 0.22)`);
    g.addColorStop(1, `hsla(${blobHue[i]}, ${sat}%, ${L * 0.5}%, 0)`);
    fctx.fillStyle = g;
    fctx.fillRect(0, 0, w, h);
  }
  fctx.globalCompositeOperation = 'source-over';
}

function drawWheel(c, ctx, vs, opts = {}) {
  sizeCanvas(c);
  const W = c.width, cx = W / 2, cy = W / 2, R = W * 0.38, dpr = W / c.clientWidth || 1;
  const dim = opts.dim || 1;
  const rot = -Math.PI / 2 + vs.t * TAU / 900;          // one slow turn every fifteen minutes
  const ang = pc => rot + wheelPos(pc) * TAU / 12;
  const pt = (pc, r = R) => [cx + Math.cos(ang(pc)) * r, cy + Math.sin(ang(pc)) * r];
  const sat = S.color.sat + 10;
  const env = vs.breath.env;
  ctx.clearRect(0, 0, W, W);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // breath halo
  ctx.beginPath();
  ctx.arc(cx, cy, R * (1.04 + 0.12 * env), 0, TAU);
  ctx.strokeStyle = `rgba(255, 236, 220, ${(vs.breath.key !== 'off' ? 0.1 + 0.18 * env : 0.06) * dim})`;
  ctx.lineWidth = 1.2 * dpr;
  ctx.stroke();
  // base ring
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.strokeStyle = `rgba(255, 236, 220, ${0.12 * dim})`; ctx.lineWidth = dpr; ctx.stroke();

  const tonic = vs.ev.tonic;
  const path = vs.ev.prog.q.map(tok => mod(tonic + tok.d));
  const drawPath = (roots, alpha, width) => {
    for (let i = 0; i < roots.length; i++) {
      const a = roots[i], b = roots[(i + 1) % roots.length];
      if (a === b) continue;
      const [x1, y1] = pt(a), [x2, y2] = pt(b);
      const g = ctx.createLinearGradient(x1, y1, x2, y2);
      g.addColorStop(0, `hsla(${hueOf(a)}, ${sat}%, 66%, ${alpha})`);
      g.addColorStop(1, `hsla(${hueOf(b)}, ${sat}%, 66%, ${alpha})`);
      ctx.strokeStyle = g; ctx.lineWidth = width * dpr;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  };
  // mandala of past progressions
  ghosts.forEach((gh, i) => drawPath(gh, (0.05 + 0.1 * (i + 1) / ghosts.length) * dim, 1));
  // current progression
  drawPath(path, 0.42 * dim, 1.6);

  // current chord's shape
  const pcs = chordPcs(vs.ev);
  const sorted = [...new Set(pcs)].sort((a, b) => wheelPos(a) - wheelPos(b));
  ctx.beginPath();
  sorted.forEach((pc, i) => { const [x, y] = pt(pc); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath();
  ctx.fillStyle = `hsla(${hueOf(vs.ev.root)}, ${sat}%, 60%, ${(0.08 + 0.08 * env) * dim})`;
  ctx.fill();
  ctx.strokeStyle = `hsla(${hueOf(vs.ev.root)}, ${sat}%, 78%, ${0.55 * dim})`;
  ctx.lineWidth = 1.4 * dpr; ctx.stroke();

  // nodes
  ctx.font = `${11 * dpr}px -apple-system, system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let pc = 0; pc < 12; pc++) {
    const on = pcs.includes(pc), isRoot = pc === vs.ev.root;
    const [x, y] = pt(pc);
    const r = (isRoot ? 6 + 2.5 * env : on ? 4.5 : 2.6) * dpr;
    ctx.save();
    if (on) { ctx.shadowColor = `hsla(${hueOf(pc)}, 90%, 70%, ${0.9 * dim})`; ctx.shadowBlur = (14 + 10 * env) * dpr; }
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
    ctx.fillStyle = `hsla(${hueOf(pc)}, ${sat}%, ${on ? 72 : 55}%, ${(on ? 0.95 : 0.55) * dim})`;
    ctx.fill();
    ctx.restore();
    if (!opts.noLabels) {
      const [lx, ly] = pt(pc, R + 18 * dpr);
      ctx.fillStyle = `rgba(244, 233, 223, ${(on ? 0.85 : 0.35) * dim})`;
      ctx.fillText(NOTE[pc], lx, ly);
    }
  }

  // center: chord name and breath word
  if (engine.playing || opts.center) {
    ctx.fillStyle = `rgba(244, 233, 223, ${0.88 * dim})`;
    ctx.font = `300 ${W * 0.075}px Spectral, Georgia, serif`;
    ctx.fillText(chordName(vs.ev), cx, cy - (vs.breath.key !== 'off' ? W * 0.02 : 0));
    if (vs.breath.key !== 'off' && vs.breath.phase >= 0) {
      ctx.font = `italic 300 ${W * 0.036}px Spectral, Georgia, serif`;
      const fade = vs.breath.phase === 3 ? 0.35 : 0.65;
      ctx.fillStyle = `rgba(244, 233, 223, ${fade * dim})`;
      ctx.fillText(BREATH_WORDS[vs.breath.phase], cx, cy + W * 0.06);
    }
  }
}

function updateNow(vs) {
  const ev = vs.ev, p = ev.prog;
  const key = `${p.id}|${ev.tonic}|${ev.pass ?? 0}`;
  if (key !== lastProgKey) {
    // a new progression (or key) began: keep the old figure as a ghost
    if (lastProgKey && engine.playing && ev.fresh) {
      const [pid, tonic] = lastProgKey.split('|');
      const old = PROGRESSIONS.find(x => x.id === pid);
      if (pid !== p.id || +tonic !== ev.tonic) {
        ghosts.push(old.q.map(tok => mod(+tonic + tok.d)));
        if (ghosts.length > 14) ghosts.shift();
      }
    }
    lastProgKey = key;
    $('nowKey').innerHTML = p.name === p.roman ? keyName(ev) : `${keyName(ev)} <i>·</i> ${p.name}`;
    $('nowRoman').innerHTML = p.romans.map((r, i) => `<span data-i="${i}">${r}</span>`).join(' – ');
    $('nowSong').textContent = `as in ${p.song}`;
  }
  const spans = $('nowRoman').children;
  for (const s of spans) s.classList.toggle('cur', +s.dataset.i === ev.idx && engine.playing);
}

function updateClock() {
  if (!engine.playing) { $('clock').textContent = S.sleep.timer ? `sleep in ${S.sleep.timer} min` : ''; return; }
  const e = engine.elapsed(), mm = Math.floor(e / 60), ss = Math.floor(e % 60).toString().padStart(2, '0');
  let s = `${mm}:${ss}`;
  if (S.sleep.timer) s += ` · ${Math.max(0, Math.ceil(S.sleep.timer - e / 60))} min left`;
  $('clock').textContent = s;
}

let swatchKey = '';
function frame(now) {
  const dt = Math.min(0.25, (now - lastFrame) / 1000);
  lastFrame = now;
  const vs = visualState();
  drawField(vs, dt);
  if (document.body.classList.contains('immersed')) {
    drawWheel(immWheel, ictx, vs, { dim: 0.7, noLabels: true, center: true });
  } else {
    drawWheel(wheel, wctx, vs);
    updateNow(vs);
    updateClock();
    if (S.tab === 'color') {
      const k = vs.palette.map(Math.round).join(',') + S.color.sat;
      if (k !== swatchKey) { swatchKey = k; renderSwatches(vs.palette); }
    }
  }
  requestAnimationFrame(frame);
}

/* =========================================================
   Panels
   ========================================================= */
const FMT = {
  pct: v => Math.round(v * 100) + '%',
  sec: v => v + ' s',
  hz: v => (+v).toFixed(v < 10 ? 2 : 1) + ' Hz',
  deg: v => Math.round(v) + '°',
  int: v => Math.round(v) + '%',
};
const fmtOf = {};
function slider(path, label, min, max, step, fmt = 'pct') {
  fmtOf[path] = FMT[fmt];
  const v = getPath(path);
  return `<label class="row"><span class="row-l">${label}</span>
    <input type="range" data-path="${path}" min="${min}" max="${max}" step="${step}" value="${v}" aria-label="${label}">
    <span class="row-v" data-out="${path}">${FMT[fmt](v)}</span></label>`;
}
function seg(path, label, opts) {
  const cur = getPath(path);
  return `<div class="row wide"><span class="row-l">${label}</span><div class="seg" role="group" aria-label="${label}">
    ${opts.map(([v, l]) => `<button data-path="${path}" data-v='${JSON.stringify(v)}' aria-pressed="${v === cur}">${l}</button>`).join('')}
  </div></div>`;
}

const PANELS = {
  journey: () => `
    <h2>Journey</h2>
    <p class="note">The app walks an endless path through these progressions. Each one repeats two or three times, then the key steps around the circle of fifths, or along Coltrane’s major-third triangle, to a new home.</p>
    ${slider('cycle', 'Per chord', 4, 24, 1, 'sec')}
    ${seg('rich', 'Chords', [[false, 'Triads'], [true, 'Sevenths']])}
    ${seg('wander', 'Key changes', [['stay', 'Stay home'], ['fifths', 'By fifths'], ['coltrane', 'Coltrane']])}
    ${seg('tuning', 'Tuning', [[440, 'A = 440'], [432, 'A = 432']])}
    <h2>Progressions</h2>
    <ul class="pool">${PROGRESSIONS.map(p => `<li><label><input type="checkbox" data-pool="${p.id}" ${S.pool[p.id] ? 'checked' : ''}>
      <span><b>${p.name}</b><small>${p.roman} · ${p.song}</small></span></label></li>`).join('')}</ul>
    <div class="share"><span>Journey #${journey.seed}</span><button id="copyLink">Copy link to this journey</button></div>`,
  sound: () => `
    <h2>Drone</h2>
    ${slider('drone.vol', 'Pad', 0, 1, 0.01)}
    ${slider('drone.bass', 'Bass', 0, 1, 0.01)}
    ${slider('drone.bright', 'Brightness', 0, 1, 0.01)}
    <h2>Bells</h2>
    ${slider('pulse.vol', 'Level', 0, 1, 0.01)}
    ${slider('pulse.density', 'Density', 0, 1, 0.01)}
    <h2>Space</h2>
    ${slider('space', 'Reverb', 0, 1, 0.01)}`,
  beats: () => `
    <h2>Binaural beats</h2>
    <p class="note">Each ear gets a slightly different tone. The brain hears the difference as a slow pulse, which may help it settle toward that rhythm. Headphones are required.</p>
    ${slider('beats.vol', 'Level', 0, 1, 0.01)}
    ${seg('beats.state', 'State', Object.entries(BEAT_STATES).map(([k, b]) => [k, `${b.sym} ${b.name}`]))}
    ${slider('beats.hz', 'Beat', 1, 14, 0.01, 'hz')}
    <p class="note" id="beatTip">${(BEAT_STATES[S.beats.state] || {}).tip || 'Custom frequency'}</p>
    ${seg('beats.descend', 'Descend', [[false, 'Hold steady'], [true, 'Drift down from alpha']])}
    ${seg('beats.carrier', 'Carrier', [['chord', 'Follows the chord'], ['om', 'Om · 136.1 Hz']])}`,
  noise: () => `
    <h2>Noise</h2>
    ${slider('noise.vol', 'Level', 0, 1, 0.01)}
    ${seg('noise.type', 'Texture', [['brown', 'Brown'], ['pink', 'Pink'], ['ocean', 'Ocean']])}
    <p class="note">Ocean noise swells and recedes with your breath.</p>`,
  color: () => `
    <h2>Color</h2>
    <p class="note">Every note has a hue. Each chord becomes a constellation on the color wheel, and the colors drift slowly from chord to chord.</p>
    <div class="swatches" id="swatches"></div>
    ${seg('color.harmony', 'Harmony', Object.entries(HARMONIES).map(([k, h]) => [k, h.name]))}
    ${seg('color.map', 'Notes to hues', [['fifths', 'Circle of fifths'], ['chromatic', 'Chromatic']])}
    ${slider('color.shift', 'Rotate hues', 0, 359, 1, 'deg')}
    ${slider('color.sat', 'Saturation', 10, 90, 1, 'int')}
    ${slider('color.glow', 'Glow', 0.1, 1.4, 0.01)}`,
  sleep: () => `
    <h2>Breath</h2>
    <p class="note">The drone swells as you breathe in and softens as you breathe out. Follow the ring around the circle.</p>
    ${seg('breath.pattern', 'Pattern', Object.entries(BREATH).map(([k, b]) => [k, b.name]))}
    ${slider('breath.depth', 'Swell', 0, 1, 0.01)}
    <h2>Sleep</h2>
    ${seg('sleep.timer', 'Timer', [[0, 'Off'], [15, '15 m'], [30, '30 m'], [45, '45 m'], [60, '1 h'], [90, '1½ h']])}
    ${slider('sleep.warmth', 'Warmth', 0, 1, 0.01)}
    <p class="note">The sound fades out over the final minute. Warmth rolls off the highs.</p>`,
};

function renderPanel() {
  $('panel').innerHTML = PANELS[S.tab]();
  for (const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', t.dataset.tab === S.tab);
  swatchKey = '';
  const copy = $('copyLink');
  if (copy) copy.onclick = () => {
    const url = location.origin + location.pathname + '#j=' + journey.seed;
    history.replaceState(null, '', '#j=' + journey.seed);
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
      () => (copy.textContent = 'Copied'), () => (copy.textContent = url));
  };
}
function renderSwatches(pal) {
  const el = $('swatches');
  if (!el) return;
  el.innerHTML = pal.map(h => `<div class="sw" style="background:hsl(${h}, ${S.color.sat}%, 62%)"><span>${colorName(h)}</span></div>`).join('');
}

function changed(path) {
  save();
  engine.live(path);
  renderChips();
  if (path === 'beats.state') {
    S.beats.hz = BEAT_STATES[S.beats.state].hz; save();
    engine.live('beats.hz');
    renderPanel();
  }
  if (path === 'beats.hz') {
    const match = Object.entries(BEAT_STATES).find(([, b]) => Math.abs(b.hz - S.beats.hz) < 0.005);
    S.beats.state = match ? match[0] : 'custom'; save();
    for (const b of document.querySelectorAll('[data-path="beats.state"]')) b.setAttribute('aria-pressed', JSON.parse(b.dataset.v) === S.beats.state);
    const tip = $('beatTip'); if (tip) tip.textContent = match ? match[1].tip : 'Custom frequency';
  }
}

$('panel').addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.path) {
    setPath(el.dataset.path, +el.value);
    const out = document.querySelector(`[data-out="${el.dataset.path}"]`);
    if (out) out.textContent = fmtOf[el.dataset.path](+el.value);
    changed(el.dataset.path);
  } else if (el.dataset.pool) {
    S.pool[el.dataset.pool] = el.checked;
    save();
  }
});
$('panel').addEventListener('click', e => {
  const b = e.target.closest('.seg button');
  if (!b) return;
  setPath(b.dataset.path, JSON.parse(b.dataset.v));
  for (const x of b.parentElement.children) x.setAttribute('aria-pressed', x === b);
  changed(b.dataset.path);
});
$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  S.tab = t.dataset.tab; save();
  renderPanel();
});

/* =========================================================
   Chips: quick toggles
   ========================================================= */
const CYCLES = [6, 8, 10, 14, 20];
function renderChips() {
  $('c-cycle').textContent = S.cycle + 's';
  const b = BEAT_STATES[S.beats.state];
  $('c-beats').textContent = S.beats.vol === 0 ? 'off' : b ? `${b.sym} ${b.hz}` : `${S.beats.hz.toFixed(1)}`;
  $('c-breath').textContent = BREATH[S.breath.pattern].name;
  $('c-colors').textContent = HARMONIES[S.color.harmony].short;
}
const cycleNext = (list, cur) => list[(list.indexOf(cur) + 1) % list.length];
$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  const kind = c.dataset.chip;
  if (kind === 'cycle') { S.cycle = cycleNext(CYCLES, S.cycle) ?? 10; changed('cycle'); }
  if (kind === 'beats') {
    const order = ['theta', 'delta', 'schumann', 'alpha', 'off'];
    const cur = S.beats.vol === 0 ? 'off' : S.beats.state;
    const next = cycleNext(order, cur) ?? 'theta';
    if (next === 'off') { S.beats._vol = S.beats.vol; S.beats.vol = 0; changed('beats.vol'); }
    else {
      if (S.beats.vol === 0) { S.beats.vol = S.beats._vol || 0.5; changed('beats.vol'); }
      S.beats.state = next; changed('beats.state');
    }
  }
  if (kind === 'breath') { S.breath.pattern = cycleNext(Object.keys(BREATH), S.breath.pattern); changed('breath.pattern'); }
  if (kind === 'colors') { S.color.harmony = cycleNext(Object.keys(HARMONIES), S.color.harmony); changed('color.harmony'); }
  renderPanel();
});

/* =========================================================
   Immersive mode
   ========================================================= */
async function requestWake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
}
let hintTimer = 0;
function showHint() {
  $('immHint').style.opacity = 1;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => ($('immHint').style.opacity = 0), 2500);
}
function enterImmerse() {
  document.body.classList.add('immersed');
  $('immerse').hidden = false;
  showHint();
  requestWake();
  if (!engine.playing) startPlayback();
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
}
function exitImmerse() {
  document.body.classList.remove('immersed');
  $('immerse').hidden = true;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
let lastTap = 0;
$('immerse').addEventListener('click', () => {
  const now = performance.now();
  if (now - lastTap < 350) exitImmerse(); else showHint();
  lastTap = now;
});

/* =========================================================
   Wiring
   ========================================================= */
$('playBtn').onclick = togglePlay;
$('stagePlay').onclick = togglePlay;
$('newBtn').onclick = newJourney;
$('immerseBtn').onclick = enterImmerse;
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'n' || e.key === 'N') newJourney();
  else if (e.key === 'i' || e.key === 'I') document.body.classList.contains('immersed') ? exitImmerse() : enterImmerse();
  else if (e.key === 'Escape' && document.body.classList.contains('immersed')) exitImmerse();
});
window.addEventListener('hashchange', () => {
  const m = location.hash.match(/j=(\d+)/);
  if (m && +m[1] !== journey.seed) { journey = new Journey(+m[1]); if (engine.playing) engine.journey = journey; renderPanel(); }
});

renderChips();
renderPanel();
requestAnimationFrame(frame);
</script>
</body>
